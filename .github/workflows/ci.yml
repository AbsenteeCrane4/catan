name: Catan CI/CD Pipeline

on:
  push:
    branches: 
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for Linting Errors
        run: npm run lint
        continue-on-error: false

      - name: Run Vitest
        run: npm run test

  e2e:
    name: Run Cypress E2E Tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Runs against a production build and the real socket server, because the
      # specs drive genuine socket.io traffic: extra players are bots connected
      # from the Cypress Node process, not stubbed responses. The action caches
      # the ~200 MB Cypress binary keyed on the version in package-lock.json.
      - name: Build, start server and run Cypress
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120

      - name: Upload screenshots from failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      # Video is enabled only when CI is set (see cypress.config.ts), so a failing
      # run can be watched back rather than reasoned about from a stack trace.
      - name: Upload run videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

  docker-publish:
    name: Build & Push Docker Image
    # e2e runs in parallel with build (both only need test), and both must pass
    # before anything is published — a broken lobby or board must not reach prod.
    needs: [build, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tags as 'latest' if on the main branch
            type=raw,value=latest,enable={{is_default_branch}}
            
            # This captures any tag name
            type=ref,event=tag

            # Add a the short SHA as a tag for traceability when pushing to the main branch without a tag
            type=sha,format=short

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    name: Deploy to Production Server
    needs: docker-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: 
      packages: read

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Passes the temporary GitHub token into the SSH environment
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN,USERNAME,IMAGE, REGISTRY
          script: |
            # 1. Lower case the image name
            IMAGE="${IMAGE,,}"

            # 2. Navigate to the directory containing your docker-compose.yml
            cd ~/Catan
            
            # 3. Log Docker into GHCR using the temporary Actions token
            echo $GH_TOKEN | docker login $REGISTRY -u $USERNAME --password-stdin
            
            # 4. Pull the fresh image we just built
            docker pull $IMAGE
            
            # 5. Restart the container with the new image in the background
            docker compose up -d
            
            # 6. Clean up old, unused Docker images
            docker image prune -f

            # 7. Logout of the GHCR
            docker logout $REGISTRY