name: Catan CI/CD Pipeline

on:
  push:
    branches: 
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for Linting Errors
        run: npm run lint
        continue-on-error: false

      - name: Run Vitest
        run: npm run test

  build:
    name: Production Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

  docker-publish:
    name: Build & Push Docker Image
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tags as 'latest' if on the main branch
            type=raw,value=latest,enable={{is_default_branch}}
            
            # This captures any tag name
            type=ref,event=tag

            # Add a the short SHA as a tag for traceability when pushing to the main branch without a tag
            type=sha,format=short

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    name: Deploy to Production Server
    needs: docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions: 
      packages: read

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Passes the temporary GitHub token into the SSH environment
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN,USERNAME,IMAGE, REGISTRY
          script: |
            # 1. Navigate to the directory containing your docker-compose.yml
            cd ~/Catan
            
            # 2. Log Docker into GHCR using the temporary Actions token
            echo $GH_TOKEN | docker login $REGISTRY -u $USERNAME --password-stdin
            
            # 3. Pull the fresh image we just built
            docker pull $IMAGE
            
            # 4. Restart the container with the new image in the background
            docker compose up -d
            
            # 5. Clean up old, unused Docker images to save disk space on your server
            docker image prune -f

            # 6. Logout of the GHCR
            docker logout $REGISTRY